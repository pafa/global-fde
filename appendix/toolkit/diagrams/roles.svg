<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 512" role="img" aria-labelledby="title desc"><title id="title">现场建议怎样进入共同产品</title><desc id="desc">作者教学示意。客户工作：问题、使用反馈与验收条件；现场工程：发现约束，验证一个可运行改动；产品团队：决定是否纳入共同版本并持续维护</desc><rect width="480" height="512" fill="#f7f6ef"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#244f40"/></marker></defs><text x="24" y="39" font-size="21" font-family="sans-serif" fill="#244f40">现场建议怎样进入共同产品</text><rect x="24" y="68" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="100" font-size="21" font-family="sans-serif" fill="#244f40">01　客户工作</text><text x="43" y="132" font-size="17" font-family="sans-serif" fill="#455c4e">问题、使用反馈与验收条件</text><path d="M240 164 V186" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="194" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="226" font-size="21" font-family="sans-serif" fill="#244f40">02　现场工程</text><text x="43" y="258" font-size="17" font-family="sans-serif" fill="#455c4e">发现约束，验证一个可运行改动</text><path d="M240 290 V312" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="320" width="432" height="116" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="352" font-size="21" font-family="sans-serif" fill="#244f40">03　产品团队</text><text x="43" y="380" font-size="17" font-family="sans-serif" fill="#455c4e">决定是否纳入共同版本</text><text x="43" y="405" font-size="17" font-family="sans-serif" fill="#455c4e">并持续维护</text><text x="24" y="497" font-size="14" font-family="sans-serif" fill="#64716b">作者教学示意 · 依据正文关系归纳</text></svg>