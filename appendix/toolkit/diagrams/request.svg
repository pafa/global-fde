<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 664" role="img" aria-labelledby="title desc"><title id="title">丢失回执之后，先找同一次动作</title><desc id="desc">作者教学示意。记录意图：请求前提、动作ID与获准范围；执行并留证：把业务结果与动作ID可靠关联；回执没有到达：读取已有结果；不要盲目再做一次；恢复与决定：旧查询按需求版本失效；已完成写入按动作ID核对，不因查询失效重做</desc><rect width="480" height="664" fill="#f7f6ef"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#244f40"/></marker></defs><text x="24" y="39" font-size="21" font-family="sans-serif" fill="#244f40">丢失回执之后，先找同一次动作</text><rect x="24" y="68" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="100" font-size="21" font-family="sans-serif" fill="#244f40">01　记录意图</text><text x="43" y="132" font-size="17" font-family="sans-serif" fill="#455c4e">请求前提、动作ID与获准范围</text><path d="M240 164 V186" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="194" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="226" font-size="21" font-family="sans-serif" fill="#244f40">02　执行并留证</text><text x="43" y="258" font-size="17" font-family="sans-serif" fill="#455c4e">把业务结果与动作ID可靠关联</text><path d="M240 290 V312" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="320" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="352" font-size="21" font-family="sans-serif" fill="#244f40">03　回执没有到达</text><text x="43" y="384" font-size="17" font-family="sans-serif" fill="#455c4e">读取已有结果；不要盲目再做一次</text><path d="M240 416 V438" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="446" width="432" height="132" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="478" font-size="21" font-family="sans-serif" fill="#244f40">04　分清两种规则</text><text x="43" y="510" font-size="17" font-family="sans-serif" fill="#455c4e">旧查询：按需求版本丢弃过期结果。</text><text x="43" y="536" font-size="17" font-family="sans-serif" fill="#455c4e">已完成写入：按动作ID核对回执，</text><text x="43" y="562" font-size="17" font-family="sans-serif" fill="#455c4e">不因旧查询失效而重新执行。</text><text x="24" y="639" font-size="14" font-family="sans-serif" fill="#64716b">作者教学示意 · 依据正文关系归纳</text></svg>