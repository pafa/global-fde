<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 638" role="img" aria-labelledby="title desc"><title id="title">一次试点的决定怎样逐步收窄</title><desc id="desc">作者教学示意。提出问题：要改变哪项任务；列出替代方式；限定试验：数据、角色、指标、停止与恢复条件；检查结果：继续、缩小或暂停；保留未决证据；接手与复用：核验客户能否继续操作、团队留下什么</desc><rect width="480" height="638" fill="#f7f6ef"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#244f40"/></marker></defs><text x="24" y="39" font-size="21" font-family="sans-serif" fill="#244f40">一次试点的决定怎样逐步收窄</text><rect x="24" y="68" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="100" font-size="21" font-family="sans-serif" fill="#244f40">01　提出问题</text><text x="43" y="132" font-size="17" font-family="sans-serif" fill="#455c4e">要改变哪项任务；列出替代方式</text><path d="M240 164 V186" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="194" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="226" font-size="21" font-family="sans-serif" fill="#244f40">02　限定试验</text><text x="43" y="258" font-size="17" font-family="sans-serif" fill="#455c4e">数据、角色、指标、停止与恢复条件</text><path d="M240 290 V312" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="320" width="432" height="92" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="352" font-size="21" font-family="sans-serif" fill="#244f40">03　检查结果</text><text x="43" y="384" font-size="17" font-family="sans-serif" fill="#455c4e">继续、缩小或暂停；保留未决证据</text><path d="M240 416 V438" stroke="#244f40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="446" width="432" height="116" rx="7" fill="#fffef9" stroke="#bac8b8"/><text x="43" y="478" font-size="21" font-family="sans-serif" fill="#244f40">04　接手与复用</text><text x="43" y="506" font-size="17" font-family="sans-serif" fill="#455c4e">核验客户能否继续操作、</text><text x="43" y="531" font-size="17" font-family="sans-serif" fill="#455c4e">团队留下什么</text><text x="24" y="623" font-size="14" font-family="sans-serif" fill="#64716b">作者教学示意 · 依据正文关系归纳</text></svg>