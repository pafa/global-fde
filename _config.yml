title: 全球FDE实战
description: 从概念的早期记录到全球行业现场，一本兼顾经营与技术的中文开放书。
url: https://pafa.github.io
baseurl: /global-fde
repository: pafa/global-fde
edition: 2026年9月修订版
cutoff_date: "2026-09-30"
lang: zh-CN
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
include:
  - README.md
optional_front_matter:
  remove_originals: true
relative_links:
  enabled: true
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
defaults:
  - scope:
      path: ""
    values:
      layout: book
  - scope:
      path: README.md
    values:
      title: 全球FDE实战
      permalink: /
      nav: false
